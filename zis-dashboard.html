addEventListener('wheel',exitPresentationFocus,{passive:true});
addEventListener('touchstart',exitPresentationFocus,{passive:true});

/* The fixed header clears the stage when idle and returns on intent. */
const pageHeader=document.querySelector('header');
let headerHideTimer=0;
let lastHeaderScroll=Math.max(window.scrollY,0);
function cancelHeaderHide(){
 clearTimeout(headerHideTimer);
 headerHideTimer=0;
}
function hideHeader(){
 cancelHeaderHide();
 if(Math.max(window.scrollY,0)<=24){
  pageHeader.classList.remove('header-hidden');
  return;
 }
 if(pageHeader.matches(':hover')||pageHeader.contains(document.activeElement))return;
 pageHeader.classList.add('header-hidden');
}
function scheduleHeaderHide(delay=2400){
 cancelHeaderHide();
 headerHideTimer=setTimeout(hideHeader,delay);
}
function showHeader(delay=2400){
 pageHeader.classList.remove('header-hidden');
 scheduleHeaderHide(delay);
}
function updateHeaderOnScroll(){
 const y=Math.max(window.scrollY,0);
 const delta=y-lastHeaderScroll;
 if(delta>5&&y>24)hideHeader();
 else if(delta<-5)showHeader();
 lastHeaderScroll=y;
}
addEventListener('scroll',updateHeaderOnScroll,{passive:true});
addEventListener('pointermove',e=>{if(e.clientY<=18)showHeader()},{passive:true});
pageHeader.addEventListener('pointerenter',cancelHeaderHide);
pageHeader.addEventListener('pointerleave',()=>scheduleHeaderHide());
pageHeader.addEventListener('focusin',()=>{pageHeader.classList.remove('header-hidden');cancelHeaderHide()});
pageHeader.addEventListener('focusout',()=>scheduleHeaderHide());
pageHeader.addEventListener('click',e=>{
 if(e.detail>0&&e.target instanceof HTMLElement)e.target.blur();
 scheduleHeaderHide(1400);
});

/* ═══ ЧТЕНИЕ ГУГЛ-ТАБЛИЦЫ ═══ */
function parseCsv(text){
 const rows=[]; let row=[], cur='', q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
  else if(c==='"') q=true;
  else if(c===','){ row.push(cur); cur='' }
  else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur='' }
  else if(c!=='\r') cur+=c;
 }
 if(cur!==''||row.length){ row.push(cur); rows.push(row) }
 return rows;
}
/* обе строки шапки отбрасываем по первой ячейке — так надёжнее,
   чем считать строки: gviz по-разному трактует заголовок */
const HDR=new Set(['id','id id','Мектеп id','id школы','Мектеп id id школы','Код','Түрі','Тип','Параметр','Мектеп атауы']);
const dataRows=rs=>rs.filter(r=>r.length&&String(r[0]).trim()&&!HDR.has(String(r[0]).trim()));

const sv=v=>String(v??'').trim();
const nv=v=>{const s=sv(v).replace(/\s| /g,'').replace(',','.');return s===''||isNaN(+s)?null:+s};
const html=v=>sv(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LVLB={'халықаралық':'int','республикалық':'rep','облыстық':'obl','қалалық':'city'};
const PLCB={'1':1,'2':2,'3':3,'бас жүлде':'gp','грамота':'gr','алғыс хат':'let'};
const sheetTime=value=>new Date(value).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

function saveSheetCache(data,format='api'){
 try{
  localStorage.setItem(SHEET_CACHE_KEY,JSON.stringify({savedAt:Date.now(),format,data}));
 }catch(_){}
}
function loadSheetCache(){
 try{
  const cached=JSON.parse(localStorage.getItem(SHEET_CACHE_KEY)||'null');
  const maxAge=SHEET.cacheHours*60*60*1000;
  if(!cached||!cached.savedAt||Date.now()-cached.savedAt>maxAge)return null;
  cached.format=cached.format||'api';
  if(cached.format==='api'&&(!cached.data||!Array.isArray(cached.data.schools)||!Array.isArray(cached.data.annual)))return null;
  if(cached.format==='csv'&&(!cached.data||!Array.isArray(cached.data['Мектептер'])))return null;
  return cached;
 }catch(_){return null}
}
function applySheetCache(cached){
 if(cached.format==='csv')applySheet(cached.data);
 else applyApiData(cached.data);
}

async function pullSheetApi(){
 const url=sv(SHEET.api);
 if(!url) throw new Error('URL Apps Script Web App не указан');
 let lastError=null;
 for(let attempt=1;attempt<=SHEET.retryAttempts;attempt++){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),SHEET.timeoutMs);
  try{
   const r=await fetch(url+(url.includes('?')?'&':'?')+'ts='+Date.now(),{
    cache:'no-store',
    redirect:'follow',
    signal:controller.signal
   });
   if(!r.ok)throw new Error('Apps Script — HTTP '+r.status);
   const text=await r.text();
   let payload;
   try{payload=JSON.parse(text)}
   catch(_){throw new Error('Apps Script вернул не JSON')}
   if(payload&&payload.ok===false)throw new Error(payload.error||'Apps Script вернул ошибку');
   const data=payload&&payload.data?payload.data:payload;
   if(!data||!Array.isArray(data.schools))throw new Error('Apps Script вернул неизвестный формат');
   data.annual=await pullAnnualResults(controller.signal);
   return data;
  }catch(e){
   lastError=e&&e.name==='AbortError'?new Error('Apps Script — превышено время ожидания'):e;
  }finally{
   clearTimeout(timeout);
  }
  if(attempt<SHEET.retryAttempts)await wait(700*attempt);
 }
 throw lastError||new Error('Apps Script недоступен');
}

async function pullAnnualResults(signal){
 const url=`https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?tqx=out:csv&gid=265151043&ts=${Date.now()}`;
 const r=await fetch(url,{cache:'no-store',signal});
 if(!r.ok)throw new Error('Жылдық нәтижелер — HTTP '+r.status);
 const rows=parseCsv(await r.text()).slice(1);
 const annual=rows.map(row=>({
  s:sv(row[0]),kz:sv(row[1]),ru:sv(row[2]),
  values:[nv(row[3]),nv(row[4]),nv(row[5])],note:sv(row[6])
 })).filter(row=>row.s&&row.kz&&row.values.some(v=>v!=null));
 if(!annual.length)throw new Error('Жылдық нәтижелер — деректер табылмады');
 return annual;
}

async function pullSheetCsv(){
 const base=`https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?tqx=out:csv&sheet=`;
 const pairs=await Promise.all(SHEET.tabs.map(async name=>{
  const r=await fetch(base+encodeURIComponent(name)+'&ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error(name+' — HTTP '+r.status);
  const text=await r.text();
  if(/^\s*</.test(text))throw new Error('таблица закрыта для чтения');
  return [name,dataRows(parseCsv(text))];
 }));
 const out=Object.fromEntries(pairs);
 return out;
}

function applySettings(st){
 if(sv(st['Салыстыру кезеңі басы'])) PERIOD.from=sv(st['Салыстыру кезеңі басы']);
 if(sv(st['Салыстыру кезеңі соңы'])) PERIOD.to=sv(st['Салыстыру кезеңі соңы']);
 if(nv(st['Желідегі оқушы саны'])!=null) AGG.students=nv(st['Желідегі оқушы саны']);
 if(nv(st['Мектеп саны'])!=null) AGG.schoolsOverride=nv(st['Мектеп саны']);
 if(nv(st['Қала саны'])!=null) AGG.citiesOverride=nv(st['Қала саны']);
 if(nv(st['Педагог саны'])!=null) AGG.teachersOverride=nv(st['Педагог саны']);
 if(nv(st['ҰБТ түлек саны'])!=null) AGG.graduates=nv(st['ҰБТ түлек саны']);
 if(nv(st['ҰБТ грант саны'])!=null) AGG.granted=nv(st['ҰБТ грант саны']);
 if(nv(st['ҰБТ грантының жалпы үлесі'])!=null) AGG.grantShare=nv(st['ҰБТ грантының жалпы үлесі']);
 SCHOOLS.forEach(s=>{s.nishGrants=nv(st[`НИШ гранты ${s.id}`])});
}

function applyApiData(d){
 const byId=id=>SCHOOLS.find(x=>x.id===id);

 (d.schools||[]).forEach(s=>{
  const o=byId(sv(s.id)); if(!o)return;
  if(sv(s.name))o.name=sv(s.name);
  if(sv(s.city))o.city.ru=sv(s.city);
  if(nv(s.year)!=null)o.year=nv(s.year);
  o.director=sv(s.director);
  o.students=nv(s.students); o.capacity=nv(s.capacity);
  o.reserve=nv(s.reserve); o.teachers=nv(s.teachers);
 const graduates=nv(s.graduates), granted=nv(s.granted);
 o.grants=graduates>0&&granted!=null?+(granted/graduates*100).toFixed(1):null;
 });

 GRANTS.forEach(g=>{
  const o=byId(g.id), source=(d.schools||[]).find(s=>sv(s.id)===g.id);
  const graduates=source?nv(source.graduates):null, granted=source?nv(source.granted):null;
  if(o){g.s=o.name;if(o.grants!=null)g.pct=o.grants}
  if(graduates>0&&granted!=null){
   g.kz=`${graduates} түлектің ${granted}-і`;
   g.ru=`${granted} из ${graduates} выпускников`;
  }
 });

 const staffById=new Map((d.staff||[]).map(s=>[sv(s.id),s]));
 SCHOOLS.forEach(o=>{
  const s=staffById.get(o.id);
  if(!s){o.staff=null;return}
  const keys=['msc','mst','res','exp','mod','ped'];
  o.staff=keys.some(k=>nv(s[k])!=null)?{
   msc:nv(s.msc)||0,mst:nv(s.mst)||0,res:nv(s.res)||0,
   exp:nv(s.exp)||0,mod:nv(s.mod)||0,ped:nv(s.ped)||0
  }:null;
 });

 const wins=(d.wins||[]).map(w=>({
  s:sv(w.s),n:sv(w.n),l:sv(w.l),p:w.p??'none',
  w:sv(w.w),c:sv(w.c),t:nv(w.t)?1:0,q:nv(w.q),year:sv(w.year)
 })).filter(w=>w.n&&byId(w.s));
 WINS.splice(0,WINS.length,...wins);

 const annual=(d.annual||[]).map(r=>({
  s:sv(r.s),kz:sv(r.kz),ru:sv(r.ru),
  values:(r.values||[]).slice(0,3).map(nv),note:sv(r.note)
 })).filter(r=>r.s&&r.kz&&r.values.some(v=>v!=null));
 ANNUAL.splice(0,ANNUAL.length,...annual);

 const growth=(d.growth||[]).map(g=>{
  const o=byId(sv(g.s));
  return o?{s:o.name,c:o.c,kz:sv(g.kz),ru:sv(g.ru),from:nv(g.from),to:nv(g.to)}:null;
 }).filter(g=>g&&g.from>0&&g.to>0);
 GROWTH.splice(0,GROWTH.length,...growth);

 CLUBS.splice(0,CLUBS.length,...(d.clubs||[])
  .filter(c=>sv(c.name)).map(c=>({s:sv(c.s),name:sv(c.name),area:sv(c.area),lead:sv(c.lead)})));

 (d.goals||[]).forEach(g=>{
  const o=ORBIT.find(x=>x.ic===sv(g.ic)); if(!o)return;
  if(sv(g.short)){o.sk=sv(g.short);o.sr=sv(g.short)}
  o.now=nv(g.now); o.tgt=nv(g.tgt);
  if(sv(g.kz))o.kz=sv(g.kz); if(sv(g.ru))o.ru=sv(g.ru);
 });

 const texts=d.texts||[];
 const pick=type=>texts.filter(x=>sv(x.type)===type);
 const features=pick('ерекшелік').map(x=>({kz:[sv(x.title),sv(x.kz)],ru:[sv(x.title),sv(x.ru)]}));
 const values=pick('тірек').map((x,i)=>({ic:VALUES[i]?VALUES[i].ic:'orta',k:sv(x.title),kz:sv(x.kz),ru:sv(x.ru)}));
 const synergy=pick('синергия').map(x=>({kz:sv(x.kz),ru:sv(x.ru)}));
 const marks=pick('құрам').map(x=>({n:null,kz:sv(x.kz),ru:sv(x.ru)}));
 FEATURES.splice(0,FEATURES.length,...features);
 VALUES.splice(0,VALUES.length,...values);
 SYNERGY.splice(0,SYNERGY.length,...synergy);
 STAFF_MARKS.splice(0,STAFF_MARKS.length,...marks);

 applySettings(d.settings||{});
 derive();
}

function applySheet(d){
 const byId=id=>SCHOOLS.find(x=>x.id===id);

 (d['Мектептер']||[]).forEach(r=>{
  const o=byId(sv(r[0])); if(!o)return;
  if(sv(r[1]))o.name=sv(r[1]);
  if(sv(r[2]))o.city.ru=sv(r[2]);
  if(nv(r[3])!=null)o.year=nv(r[3]);
  o.director=sv(r[4]); o.students=nv(r[5]); o.capacity=nv(r[6]);
  o.reserve=nv(r[7]); o.teachers=nv(r[8]);
  const graduates=nv(r[9]),granted=nv(r[10]);
  o.grants=graduates>0&&granted!=null?+(granted/graduates*100).toFixed(1):null;
 });

 GRANTS.forEach(g=>{
  const o=byId(g.id),r=(d['Мектептер']||[]).find(row=>sv(row[0])===g.id);
  const graduates=r?nv(r[9]):null,granted=r?nv(r[10]):null;
  if(o){g.s=o.name;if(o.grants!=null)g.pct=o.grants}
  if(graduates>0&&granted!=null){
   g.kz=`${graduates} түлектің ${granted}-і`;
   g.ru=`${granted} из ${graduates} выпускников`;
  }
 });

 (d['Кадрлар']||[]).forEach(r=>{
  const o=byId(sv(r[0])); if(!o)return;
  const any=[1,3,4,5,6,7].some(i=>nv(r[i])!=null);
  o.staff=any?{msc:nv(r[1])||0,mst:nv(r[3])||0,res:nv(r[4])||0,
               exp:nv(r[5])||0,mod:nv(r[6])||0,ped:nv(r[7])||0}:null;
 });

 const w=(d['Жеңістер']||[]).map(r=>({s:sv(r[0]),n:sv(r[1]),l:LVLB[sv(r[2])]||'',
   p:PLCB[sv(r[3])]!==undefined?PLCB[sv(r[3])]:'none',
   w:sv(r[4]),c:sv(r[5]),t:sv(r[6])?1:0,q:nv(r[7])})).filter(x=>x.n&&byId(x.s));
 if(w.length) WINS.splice(0,WINS.length,...w);

 const annual=(d['Жылдық нәтижелер']||[]).map(r=>({s:sv(r[0]),kz:sv(r[1]),ru:sv(r[2]),
   values:[nv(r[3]),nv(r[4]),nv(r[5])],note:sv(r[6])}))
   .filter(r=>r.s&&r.kz&&r.values.some(v=>v!=null));
 if(annual.length)ANNUAL.splice(0,ANNUAL.length,...annual);

 const g=(d['Өсу']||[]).map(r=>{const o=byId(sv(r[0]));
   return o?{s:o.name,c:o.c,kz:sv(r[1]),ru:sv(r[2]),from:nv(r[3]),to:nv(r[4])}:null})
   .filter(x=>x&&x.from>0&&x.to>0);
 if(g.length) GROWTH.splice(0,GROWTH.length,...g);

 (d['Стратегия']||[]).forEach(r=>{
  const o=ORBIT.find(x=>x.ic===sv(r[0])); if(!o)return;
  if(sv(r[1])){o.sk=sv(r[1]);o.sr=sv(r[1])}
  if(nv(r[3])!=null)o.now=nv(r[3]);
  if(nv(r[4])!=null)o.tgt=nv(r[4]);
  if(sv(r[5]))o.kz=sv(r[5]); if(sv(r[6]))o.ru=sv(r[6]);
 });

 const tx=d['Мәтіндер']||[];
 const pick=t=>tx.filter(r=>sv(r[0])===t);
 const F=pick('ерекшелік').map(r=>({kz:[sv(r[1]),sv(r[2])],ru:[sv(r[1]),sv(r[3])]}));
 if(F.length) FEATURES.splice(0,FEATURES.length,...F);
 const V=pick('тірек').map((r,i)=>({ic:VALUES[i]?VALUES[i].ic:'orta',k:sv(r[1]),kz:sv(r[2]),ru:sv(r[3])}));
 if(V.length) VALUES.splice(0,VALUES.length,...V);
 const Y=pick('синергия').map(r=>({kz:sv(r[2]),ru:sv(r[3])}));
 if(Y.length) SYNERGY.splice(0,SYNERGY.length,...Y);
 const M=pick('құрам').map(r=>({n:null,kz:sv(r[2]),ru:sv(r[3])}));
 if(M.length) STAFF_MARKS.splice(0,STAFF_MARKS.length,...M);

 CLUBS.splice(0,CLUBS.length,...(d['Үйірмелер']||[])
   .filter(r=>sv(r[1])).map(r=>({s:sv(r[0]),name:sv(r[1]),area:sv(r[2]),lead:sv(r[3])})));

 const st={}; (d['Баптаулар']||[]).forEach(r=>st[sv(r[0])]=r[1]);
 applySettings(st);
 derive();
}

async function connectSheet(){
 if(!SHEET.on||sheetConnecting)return false;
 clearTimeout(sheetRetryTimer);
 sheetConnecting=true;
 sheetLastAttempt=Date.now();
 const errors=[];
 let connected=false;
 try{
  /* Прямое чтение листов быстрее и не зависит от развёртывания Apps Script. */
  try{
   const data=await pullSheetCsv();
   applySheet(data);
   saveSheetCache(data,'csv');
   sheetState={status:'sheet',source:'csv',when:sheetTime(Date.now()),error:null};
   connected=true;
  }catch(e){errors.push('CSV: '+String(e.message||e))}
  if(!connected&&sv(SHEET.api)){
   try{
    const data=await pullSheetApi();
    applyApiData(data);
    saveSheetCache(data,'api');
    sheetState={status:'sheet',source:'api',when:sheetTime(Date.now()),error:null};
    connected=true;
   }catch(e){errors.push('JSON: '+String(e.message||e))}
  }
  if(!connected){
   const cached=loadSheetCache();
   if(cached){
    applySheetCache(cached);
    sheetState={status:'sheet',source:'cache',when:sheetTime(cached.savedAt),error:errors.join(' · ')||null};
    connected=true;
   }
  }
  if(!connected&&sheetState.status==='sheet'){
   sheetState={...sheetState,source:'memory',error:errors.join(' · ')};
   connected=true;
  }
  if(!connected){
   sheetState=SHEET.strict
    ?{status:'waiting',source:'api',when:null,error:errors.join(' · ')}
    :{status:'local',source:'embedded',when:null,error:errors.join(' · ')};
  }
  render(1);
  paintLink();
  return connected;
 }finally{
  sheetConnecting=false;
  scheduleSheetReconnect();
 }
}
function scheduleSheetReconnect(){
 clearTimeout(sheetRetryTimer);
 const stale=sheetState.error&&['cache','memory'].includes(sheetState.source);
 if(!SHEET.on||!SHEET.strict||(sheetState.status!=='waiting'&&!stale))return;
 sheetRetryTimer=setTimeout(()=>{
  if(document.body.classList.contains('presentation-mode'))scheduleSheetReconnect();
  else connectSheet();
 },SHEET.reconnectMs);
}
function paintLink(){
 const el=document.getElementById('link'); if(!el)return;
 const ok=sheetState.status==='sheet';
 const waiting=sheetState.status==='waiting';
 const via={
  api:'Apps Script JSON',
  cache:'Google Sheets кеші',
  csv:'Google Sheets CSV',
  memory:'Google Sheets — текущая сессия',
  embedded:'встроенные данные'
 }[sheetState.source]||sheetState.source;
 el.className='link '+(ok?'ok':waiting?'wait':'off');
 el.title=ok
  ?`${t('linkOn')} · ${via}${sheetState.when?' · '+sheetState.when:''}${sheetState.error?' · '+sheetState.error:''}`
  :waiting
   ?`${t('linkWait')}${sheetState.error?' · '+sheetState.error:''}`
   :`${t('linkOff')}${sheetState.error?' — '+sheetState.error:''}`;
 el.querySelector('span').textContent=ok?t('linkOn'):waiting?t('linkWait'):t('linkOff');
 document.body.classList.toggle('sheet-waiting',waiting);
 const gateTitle=document.getElementById('sheetgate-title');
 const gateError=document.getElementById('sheetgate-error');
 if(gateTitle)gateTitle.textContent=t('sheetWait');
 if(gateError)gateError.textContent=waiting&&sheetState.error?sheetState.error:'';
}

/* Последний успешный ответ Sheets показываем сразу, пока в фоне идёт
   короткая проверка свежих значений. Так экран не перекрывается при обновлении. */
const initialSheetCache=loadSheetCache();
if(initialSheetCache){
 applySheetCache(initialSheetCache);
 sheetState={status:'sheet',source:'cache',when:sheetTime(initialSheetCache.savedAt),error:null};
}
render();
paintLink();
document.getElementById('link')?.addEventListener('click',()=>connectSheet());
const reconnectSheet=()=>{
 if(document.visibilityState==='visible'
  &&!document.body.classList.contains('presentation-mode')
  &&Date.now()-sheetLastAttempt>20000)connectSheet();
};
addEventListener('focus',reconnectSheet);
document.addEventListener('visibilitychange',reconnectSheet);
connectSheet();
</script>
