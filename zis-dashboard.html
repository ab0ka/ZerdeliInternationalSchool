<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIS — Мектептер желісі</title>
<style>
:root{
  --bg:#080A07; --s1:#121610; --s2:#1B2018; --s3:#252C21;
  --brand:#66D416; --brand-hi:#86EB3D; --brand-dim:#52A911; --warm:#BE8760;
  --gold:#E0B252;   /* только для международных побед — это медаль, а не оформление */
  --ink:#fff; --ink2:#C6CFC0; --ink3:#8B9584; --ink4:#5A6355;
  --c0:#52A911; --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767;
  --r:22px; --r2:14px; --hdr:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{
  scroll-behavior:smooth;background:var(--bg);scrollbar-gutter:stable;
  scrollbar-width:thin;scrollbar-color:#416f2c #090c08;
}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:#090c08}
html::-webkit-scrollbar-thumb{
  min-height:64px;border:2px solid #090c08;border-radius:999px;
  background:linear-gradient(180deg,#4f842f,#315522);
}
html::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--brand-hi),var(--brand-dim))}
html::-webkit-scrollbar-button{display:none;width:0;height:0}
html::-webkit-scrollbar-corner{background:#090c08}
body{
  color:var(--ink);
  /* фон не плоский: мягкий свет сверху и лёгкий градиент в глубину */
  background:
    radial-gradient(1400px 680px at 50% -8%, rgba(102,212,22,.06), transparent 68%),
    linear-gradient(180deg,#0B0E0A 0%,#070907 55%,#060806 100%);
  background-attachment:fixed;
  font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  font-feature-settings:'ss01','cv01';
}
/* Общая отделка всех плашек: едва заметный градиент сверху вниз плюс
   светлая волосяная кромка по верхнему краю — поверхность выглядит
   освещённой сверху, а не залитой одним цветом. */
.card,.kpi,.mapcard,.tl,.tbl,.citypanel,.chartcard,.dumb,.donut,.untc,.annual-panel,
.ss,.goal,.hz,.fcard,.vl{
  background-image:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 42%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.num{font-variant-numeric:tabular-nums}
/* Плёночное зерно поверх всего: без него большие тёмные плоскости
   выглядят мёртвой заливкой. Едва заметно, но снимает «пластик». */
body::before{content:'';position:fixed;inset:0;z-index:45;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}

/* Крупные числа — градиентной заливкой по тексту и со свечением.
   Плоский зелёный на них смотрелся как обычная подпись. */
.big-n{
  background:linear-gradient(170deg,#F2FFE4 4%,var(--brand-hi) 34%,var(--brand) 78%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 26px rgba(102,212,22,.32));
}
.glow{text-shadow:0 0 34px rgba(102,212,22,.45)}

/* ── шапка ─────────────────────────────────────────── */
header{
  position:fixed;top:0;left:0;right:0;z-index:50;height:var(--hdr);
  display:flex;align-items:center;gap:30px;padding:0 48px;
  background:rgba(8,10,7,.68);backdrop-filter:blur(24px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.06);
  transform:translateY(0);opacity:1;will-change:transform;
  transition:transform .52s cubic-bezier(.22,.8,.28,1),opacity .36s ease;
}
header.header-hidden{transform:translateY(calc(-100% - 2px));opacity:0;pointer-events:none}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo .mark{height:40px;width:auto;display:block}
.logo b{font-size:19px;font-weight:700;letter-spacing:.01em}
.logo span{color:var(--ink3);font-size:18px;font-weight:400}
nav{display:flex;gap:2px;flex:1;min-width:0;margin-left:10px}
nav a{
  text-decoration:none;font-size:15.5px;color:var(--ink3);
  padding:9px 16px;border-radius:var(--r2);white-space:nowrap;transition:.18s;
}
nav a:hover{color:var(--ink2);background:var(--s1)}
nav a.on{color:var(--brand);background:rgba(102,212,22,.11);font-weight:600}
.lang{display:flex;gap:2px;background:var(--s1);border-radius:var(--r2);padding:3px;flex-shrink:0}
.lang button{background:none;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
  color:var(--ink3);padding:6px 13px;border-radius:9px;transition:.18s;letter-spacing:.03em}
.lang button.on{background:var(--s3);color:var(--brand)}
/* индикатор связи с таблицей */
.link{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12.5px;
  padding:7px 13px;border-radius:999px;background:var(--s1);white-space:nowrap;cursor:pointer}
.link:hover{background:var(--s2)}
.link i{width:7px;height:7px;border-radius:50%;display:block}
.link.ok{color:var(--brand)} .link.ok i{background:var(--brand);box-shadow:0 0 9px var(--brand)}
.link.off{color:var(--ink4)} .link.off i{background:var(--ink4)}
.link.wait{color:var(--ink3)} .link.wait i{background:var(--brand);animation:sheetPulse 1.1s ease-in-out infinite}
.sheet-gate{display:none;position:fixed;inset:88px 0 0;z-index:45;background:rgba(5,12,7,.97);
  align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:32px}
body.sheet-waiting .sheet-gate{display:flex}
.sheet-gate .spin{width:28px;height:28px;border:3px solid var(--s3);border-top-color:var(--brand);
  border-radius:50%;animation:sheetSpin .8s linear infinite;margin-bottom:18px}
.sheet-gate b{font-size:18px;color:var(--ink);font-weight:650}
.sheet-gate small{max-width:680px;margin-top:9px;color:var(--ink4);font-size:12px;line-height:1.5}
@keyframes sheetSpin{to{transform:rotate(360deg)}}
@keyframes sheetPulse{50%{opacity:.28;box-shadow:0 0 0 5px rgba(102,212,22,.08)}}
.fs{background:var(--s1);border:0;cursor:pointer;width:40px;height:40px;border-radius:var(--r2);
  display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:.18s;flex-shrink:0}
.fs:hover{background:var(--s2);color:var(--brand)}
.fs svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── секции ────────────────────────────────────────── */
main{padding:var(--hdr) 48px 100px}
section{padding-top:76px;scroll-margin-top:var(--hdr);
  opacity:0;transform:translateY(22px);
  transition:opacity .75s cubic-bezier(.22,.85,.28,1),transform .75s cubic-bezier(.22,.85,.28,1)}
section.in{opacity:1;transform:none}
body.presentation-mode section> *{
  transform-origin:center;
  transition:opacity .48s ease,filter .48s ease,transform .58s cubic-bezier(.22,.8,.28,1);
}
body.presentation-mode section> :not(.presentation-focus){
  opacity:.3;filter:saturate(.52);transform:scale(.992);
}
body.presentation-mode section> .presentation-focus{
  opacity:1;filter:none;transform:none;
}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:56px;margin-bottom:26px;flex-wrap:wrap}
/* крупнее и легче: на больших кеглях жирность мешает, работает размер */
h2{font-size:clamp(36px,3.3vw,54px);font-weight:600;letter-spacing:-.032em;line-height:1.02}
.sub{color:var(--ink3);font-size:clamp(15px,1.08vw,19px);margin-top:11px;font-weight:400}
.headstats{display:flex;gap:40px;flex-shrink:0}
.hs{text-align:right}
.hs .v{font-size:clamp(34px,3vw,52px);font-weight:700;line-height:.92;letter-spacing:-.035em}
.hs .l{color:var(--ink4)}
.hs .l{color:var(--ink3);font-size:13.5px;margin-top:7px}

.card{background:var(--s1);border-radius:var(--r);padding:26px 28px}
.card h3{font-size:15px;font-weight:500;color:var(--ink3);margin-bottom:18px}

/* ── 1. карта ──────────────────────────────────────── */
/* ═══ ПЕРВЫЙ ЭКРАН — сцена, а не сетка карточек ═══
   Ни одной плашки: карта во всю ширину со свечением, крупная
   типографика поверх, показатели строкой внизу через волосяные линии.
   Высота держится флексом, без хрупкой формулы в пикселях. */
#s1{height:calc(100vh - var(--hdr));display:flex;flex-direction:column;
  padding:24px 0 30px;overflow:hidden;position:relative}
.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;flex-shrink:0}
.heroTl{margin-top:16px;color:var(--ink4);font-size:14.5px;line-height:1.6}
.heroTl b{color:var(--brand);font-weight:700;margin-right:5px}
.heroTl s{text-decoration:none;color:var(--ink3);margin-right:16px}
.heroMap{flex:1;min-height:0;position:relative;margin:6px 0}
.heroMap::before{content:'';position:absolute;inset:-6% -10%;pointer-events:none;
  background:radial-gradient(ellipse 52% 56% at 56% 48%,rgba(102,212,22,.16),transparent 72%)}
#map{width:100%;height:100%;display:block;position:relative}
.heroStats{display:grid;grid-template-columns:repeat(4,1fr);flex-shrink:0;
  border-top:1px solid rgba(255,255,255,.09);padding-top:24px}
.hstat{padding:0 clamp(18px,2vw,40px);border-left:1px solid rgba(255,255,255,.075)}
.hstat:first-child{border-left:0;padding-left:0}
.hstat b{display:block;font-size:clamp(38px,min(4.2vw,7vh),74px);font-weight:700;
  line-height:.88;letter-spacing:-.04em}
.hstat span{display:block;color:var(--ink2);font-size:clamp(14px,1.05vw,17px);margin-top:11px}
.hstat i{display:block;color:var(--ink4);font-size:13px;font-style:normal;margin-top:7px;line-height:1.4}

.netgrid{display:grid;grid-template-columns:2.35fr 1fr;gap:20px;align-items:stretch}
.mapcard{background:var(--s1);border-radius:var(--r);padding:22px 26px 12px;position:relative;overflow:hidden}
.mapcard::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 62% 58% at 58% 44%,rgba(102,212,22,.09),transparent 70%);pointer-events:none}
.years{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2}
.yr{background:var(--s2);border:0;cursor:pointer;font:inherit;font-size:14px;color:var(--ink3);
  padding:7px 16px;border-radius:999px;transition:.18s}
.yr:hover{color:var(--ink2);background:var(--s3)}
.yr.on{background:var(--brand);color:#08130a;font-weight:700}
/* карта не задаёт высоту раздела, а вписывается в экран */
/* 434px — всё, что занимает первый раздел кроме самой карты:
   шапка, заголовок, фильтр лет, отступы карточки и хронология.
   Так раздел заполняет экран ровно, и следующий заголовок снизу не выглядывает. */
#map{width:100%;display:block;margin-top:4px;height:clamp(250px,calc(100vh - 434px),660px)}
#kz{fill:#131813;stroke:rgba(102,212,22,.22);stroke-width:1.1}
.cityg{transition:opacity .55s}
/* тёмная обводка под подписью — чтобы читалась поверх свечения и контура */
.clabel{font-family:'Segoe UI',system-ui,sans-serif;font-size:20px;font-weight:600;
  paint-order:stroke;stroke:#080A07;stroke-width:5px;stroke-linejoin:round}

.heroTop .years{justify-content:flex-end;max-width:min(560px,42vw);flex-shrink:0}
.cityhit{cursor:pointer}
.cityhit:not(.act):hover .cdot{r:10}
.cdot{transition:r .18s;transform-box:fill-box;transform-origin:center;
  animation:cityPulse 2.8s ease-in-out infinite}
.city-ripple{fill:none;stroke:var(--brand-hi);stroke-width:1.7;vector-effect:non-scaling-stroke;
  transform-box:fill-box;transform-origin:center;pointer-events:none;opacity:0;
  animation:cityRipple 3.6s cubic-bezier(.22,.62,.36,1) infinite}
.city-ripple.r2{animation-delay:1.8s}
.cityg.act .city-ripple{stroke-width:2.2;animation-duration:2.9s}
@keyframes cityPulse{
  0%,100%{transform:scale(.94);filter:drop-shadow(0 0 4px rgba(134,235,61,.55))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 11px rgba(134,235,61,.95))}
}
@keyframes cityRipple{
  0%{transform:scale(.7);opacity:0}
  12%{opacity:.46}
  76%,100%{transform:scale(3.35);opacity:0}
}
.clabel{transition:font-size .2s}

/* Панель занимает всю высоту карты: отдельный скролл внутри неё не нужен. */
.citypanel{position:absolute;right:0;top:0;bottom:0;height:100%;
  width:min(440px,36vw);z-index:6;
  background:rgba(20,25,17,.78);backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  border-radius:var(--r);padding:20px 24px;display:flex;
  flex-direction:column;min-height:0;overflow:hidden;animation:pop .34s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateX(18px) scale(.97)}
  to{opacity:1;transform:none}}
.cp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.cp-name{font-size:clamp(24px,2vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.cp-meta{color:var(--ink3);font-size:14.5px;margin-top:5px}
.cp-close{background:var(--s2);border:0;cursor:pointer;color:var(--ink3);width:34px;height:34px;
  border-radius:10px;font-size:19px;line-height:1;transition:.18s;flex-shrink:0}
.cp-close:hover{background:var(--s3);color:var(--ink)}
.cp-agg{display:flex;gap:28px;margin-top:15px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.06)}
.cp-agg div{font-size:13px;color:var(--ink3)}
.cp-agg b{display:block;font-size:25px;color:var(--ink);font-weight:700;margin-top:2px;letter-spacing:-.01em}
.cp-list{display:grid;grid-template-rows:repeat(var(--city-schools),minmax(0,1fr));
  gap:9px;margin-top:13px;flex:1;min-height:0}
.cp-s{background:var(--s2);border-radius:var(--r2);padding:8px 15px;cursor:pointer;transition:.18s;
  min-height:0;display:flex;flex-direction:column;justify-content:center}
.cp-s:hover{background:var(--s3)}
.cp-s .n{display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:600}
.cp-s .r{display:flex;gap:16px;margin-top:8px;color:var(--ink3);font-size:13.5px;flex-wrap:wrap}
.cp-s .r b{color:var(--ink2);font-weight:600}
.cp-s .r .g{color:var(--brand)}

.kpis{display:grid;grid-template-rows:repeat(4,1fr);gap:14px;min-height:0}
.kpi{background:var(--s1);border-radius:var(--r);padding:15px 24px;display:flex;
  flex-direction:column;justify-content:center;gap:7px}
.kpi .row{display:flex;align-items:baseline;gap:14px}
/* контраст масштабов: число громкое, подпись тихая */
/* кегль зависит и от ширины, и от высоты окна: на низком экране
   крупное число раздувает карточку и первый раздел перестаёт влезать */
.kpi .v{font-size:clamp(30px,min(3.6vw,6.1vh),58px);font-weight:700;line-height:.92;letter-spacing:-.035em}
.kpi .l{color:var(--ink4);font-size:14px;letter-spacing:.01em}
.kpi .x{color:var(--ink4);font-size:13.5px;line-height:1.35;border-top:1px solid rgba(255,255,255,.05);padding-top:7px}
.kpi:first-child .v{color:var(--brand)}

.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}
.tl{background:var(--s1);border-radius:var(--r);padding:17px 24px;position:relative;overflow:hidden}
.tl::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.55}
.tl .y{font-size:27px;font-weight:700;color:var(--brand);letter-spacing:-.02em}
.tl .c{color:var(--ink2);font-size:15.5px;margin-top:6px;line-height:1.4}

/* ── 2. таблица ────────────────────────────────────── */
.tbl{background:var(--s1);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  background:var(--s2);text-align:right;font-size:12.5px;font-weight:600;color:var(--ink3);
  padding:13px 22px;cursor:pointer;user-select:none;white-space:nowrap;transition:.18s;letter-spacing:.02em;
}
thead th:hover{color:var(--brand)}
thead th.sorted{color:var(--brand)}
thead th:nth-child(1),thead th:nth-child(2),thead th:nth-child(3){text-align:left}
tbody td{padding:0 22px;height:60px;text-align:right;border-top:1px solid rgba(255,255,255,.045)}
tbody td:nth-child(1),tbody td:nth-child(2),tbody td:nth-child(3){text-align:left}
tbody tr{transition:.18s;cursor:pointer}
tbody tr:hover{background:var(--s2)}
tbody tr.sel{background:rgba(102,212,22,.09)}
.rank{font-size:15px;font-weight:700;color:var(--ink4)}
tbody tr.sel .rank{color:var(--brand)}
.sname{display:flex;align-items:center;gap:11px;font-size:17.5px;font-weight:600}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.city{color:var(--ink3);font-size:15px}
.big{font-size:22px;font-weight:700;letter-spacing:-.015em}
.mut{color:var(--ink4);font-size:18px}
.pos{color:var(--brand)}

/* ── карточка школы ────────────────────────────────── */
.profile{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:20px;margin-top:20px}
.pname{font-size:clamp(23px,1.9vw,31px);font-weight:700;letter-spacing:-.015em;line-height:1.14}
/* город, год и директор — опознание школы, а не показатели:
   выносим их отдельной строкой, чтобы не смешивались с числами ниже */
.pident{color:var(--ink3);font-size:14.5px;margin-top:8px;line-height:1.5}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px 22px;margin-top:20px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.pg{display:flex;flex-direction:column;gap:4px}
.pg span{color:var(--ink3);font-size:13.5px}
.pg b{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.05}
.pg b.none{color:var(--ink4);font-size:20px;font-weight:600}
.loadwrap{margin-top:auto;padding-top:22px}
.loadbar{height:12px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:11px}
.loadfill{height:100%;border-radius:6px;width:0;transition:width .85s cubic-bezier(.2,.85,.3,1)}
.ach{list-style:none;display:flex;flex-direction:column;gap:10px}
.ach li{background:var(--s2);border-radius:var(--r2);padding:14px 17px;font-size:15.5px;line-height:1.42}
.mb{display:grid;grid-template-columns:104px 1fr 34px;align-items:center;gap:12px;font-size:14px;margin-bottom:11px}
.mb .t{color:var(--ink3);text-align:right}
.mb .tr{height:10px;background:var(--s2);border-radius:5px;overflow:hidden}
.mb .fl{height:100%;background:var(--brand-dim);border-radius:5px;width:0;transition:width .8s cubic-bezier(.2,.85,.3,1)}
.mb .n{text-align:right;color:var(--ink2)}

/* ── 3. результаты ─────────────────────────────────── */
.gr{display:grid;grid-template-columns:repeat(3,1fr) 1.05fr;gap:20px}
.donut{background:var(--s1);border-radius:var(--r);padding:26px;text-align:center}
.donut svg{width:100%;max-width:186px;height:auto;filter:drop-shadow(0 0 18px rgba(102,212,22,.16))}
.donut .s{font-size:19px;font-weight:700;margin-top:16px}
.donut .n{color:var(--ink3);font-size:14.5px;margin-top:5px}
.untcol{display:flex;flex-direction:column;gap:20px}
.untc{background:var(--s1);border-radius:var(--r);padding:26px 28px;flex:1;display:flex;flex-direction:column;justify-content:center}
.untc .v{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.025em}
.untc .l{color:var(--ink3);font-size:15px;margin-top:9px;line-height:1.4}

/* Годовая динамика: все центры сравниваются на одном графике,
   выбранный центр остаётся в фокусе. */
.annual-frame{margin-top:64px}
.annual-frame .blockhead{margin:0 0 22px}
.annual-controls{display:flex;align-items:flex-end;justify-content:flex-end;gap:16px;flex-wrap:wrap}
.annual-picker{display:flex;flex-direction:column;gap:7px;min-width:0}
.annual-picker.metric{width:min(430px,36vw)}
.annual-picker span{color:var(--ink4);font-size:12.5px;font-weight:600}
.annual-selectbox{position:relative;display:flex;align-items:center}
.annual-selectbox i{position:absolute;left:14px;width:9px;height:9px;border-radius:50%;z-index:1;
  background:var(--pick,var(--brand));box-shadow:0 0 10px color-mix(in srgb,var(--pick,var(--brand)) 60%,transparent)}
.annual-picker select{width:100%;height:44px;border:1px solid rgba(255,255,255,.08);
  border-radius:10px;background:var(--s1);color:var(--ink);font:inherit;font-size:14.5px;
  padding:0 38px 0 34px;outline:none;cursor:pointer}
.annual-picker select:focus{border-color:rgba(134,235,61,.55);box-shadow:0 0 0 3px rgba(102,212,22,.1)}
.annual-centerbar{display:grid;grid-template-columns:repeat(var(--center-count,7),minmax(0,1fr));gap:0;margin:0 0 12px;
  border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.018);overflow:hidden}
.annual-centerbar button{position:relative;min-width:0;height:58px;border:0;border-right:1px solid rgba(255,255,255,.055);
  background:transparent;color:var(--ink3);padding:8px 12px;display:grid;grid-template-columns:10px minmax(0,1fr) auto;
  align-items:center;gap:9px;font:inherit;text-align:left;cursor:pointer;transition:background .2s ease,color .2s ease}
.annual-centerbar button:last-child{border-right:0}
.annual-centerbar button::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;
  border-radius:2px;background:var(--series-color);opacity:0;transform:scaleX(.45);transition:.2s ease}
.annual-centerbar button:hover{background:rgba(255,255,255,.035);color:var(--ink2)}
.annual-centerbar button.on{background:color-mix(in srgb,var(--series-color) 9%,transparent);color:var(--ink)}
.annual-centerbar button.on::after{opacity:1;transform:scaleX(1)}
.annual-centerbar i{width:9px;height:9px;border-radius:50%;background:var(--series-color);
  box-shadow:0 0 10px color-mix(in srgb,var(--series-color) 68%,transparent)}
.annual-centerbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600}
.annual-centerbar b{font-size:15px;color:var(--ink2);font-weight:700}
.annual-panel{background-color:var(--s1);border-radius:var(--r);padding:28px 30px 24px;
  display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:34px;min-height:390px}
.annual-chart{min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center}
.annual-chart svg{display:block;width:100%;height:clamp(240px,30vh,320px);overflow:visible}
.annual-grid{stroke:rgba(255,255,255,.075);stroke-width:1;vector-effect:non-scaling-stroke}
.annual-axis{fill:var(--ink4);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;font-weight:500}
.annual-area{opacity:.16}
.annual-series{cursor:pointer;transition:opacity .22s ease}
.annual-series.dim{opacity:.36}
.annual-series.overview{opacity:.78}
.annual-series:hover{opacity:1}
.annual-line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;path-length:1;stroke-dasharray:1;stroke-dashoffset:1;
  animation:annualDraw 1.05s cubic-bezier(.2,.85,.3,1) forwards}
.annual-hit{fill:none;stroke:transparent;stroke-width:18;vector-effect:non-scaling-stroke;pointer-events:stroke}
.annual-series.on .annual-line{stroke-width:5;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--series-color) 45%,transparent))}
.annual-point-halo{opacity:.12}
.annual-point{stroke:var(--s1);stroke-width:5;vector-effect:non-scaling-stroke;
  transform-box:fill-box;transform-origin:center;animation:annualPoint .45s ease both}
.annual-value{fill:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:23px;font-weight:700}
.annual-summary{border-left:1px solid rgba(255,255,255,.07);padding-left:30px;
  display:flex;flex-direction:column;justify-content:center;position:relative}
.annual-summary::before{content:'';position:absolute;left:-1px;top:22%;height:56%;width:2px;
  background:linear-gradient(transparent,var(--series-color),transparent)}
.annual-summary .school{color:var(--ink2);font-size:15px;font-weight:600;line-height:1.35}
.annual-summary .caption{color:var(--ink4);font-size:13px;margin-top:22px}
.annual-summary .latest{font-size:72px;font-weight:700;line-height:.95;letter-spacing:0;margin-top:5px;color:var(--series-color,var(--brand))}
.annual-summary .delta{display:inline-flex;align-self:flex-start;margin-top:18px;padding:5px 10px;
  border-radius:8px;background:color-mix(in srgb,var(--series-color,var(--brand)) 14%,transparent);
  color:var(--series-color,var(--brand));font-size:17px;font-weight:700}
.annual-summary .range{color:var(--ink3);font-size:14px;margin-top:8px}
.annual-rank{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.annual-rank button{height:29px;border:0;background:transparent;color:var(--ink3);padding:0;display:grid;
  grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:8px;font:inherit;text-align:left;cursor:pointer}
.annual-rank button:hover{color:var(--ink)}
.annual-rank i{width:7px;height:7px;border-radius:50%;background:var(--series-color);
  box-shadow:0 0 7px color-mix(in srgb,var(--series-color) 55%,transparent)}
.annual-rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.annual-rank b{color:var(--ink2);font-size:13px;font-weight:700}
.annual-note{color:var(--ink4);font-size:12.5px;line-height:1.45;margin-top:18px}
.annual-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
  min-height:260px;color:var(--ink4);font-size:15px}
@keyframes annualDraw{to{stroke-dashoffset:0}}
@keyframes annualPoint{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}

/* ── блок побед внутри «Нәтижелер» ─────────────────────── */
.blockhead{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin:64px 0 24px;flex-wrap:wrap}
.blockhead h3{font-size:clamp(27px,2.2vw,36px);font-weight:600;letter-spacing:-.026em;color:var(--ink);margin:0;line-height:1.06}
.blockhead .sub{margin-top:9px}
/* графики слева, список справа — блок держится компактным */
.winmain{display:grid;grid-template-columns:1fr 1.12fr;gap:20px;align-items:stretch}
.wincharts{display:flex;flex-direction:column;gap:20px}
/* список тянется до высоты колонки с графиками — колонки заканчиваются вровень */
.winlistcard{display:flex;flex-direction:column;padding:20px 22px;min-height:0}
.chartcard{background:var(--s1);border-radius:var(--r);padding:22px 26px}
.chartcard h4{font-size:15px;font-weight:500;color:var(--ink3);margin:0 0 14px}
.crow{display:grid;grid-template-columns:138px 1fr 34px;align-items:center;gap:14px;
  padding:7px 9px;margin:0 -9px;border-radius:10px;cursor:pointer;transition:.16s}
.crow:hover{background:var(--s2)}
.crow.on{background:var(--s3)}
.crow .t{color:var(--ink3);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;justify-content:flex-end;gap:9px}
.crow.on .t{color:var(--ink)}
.crow .tr{height:14px;background:var(--s2);border-radius:7px;overflow:hidden}
.crow.on .tr{background:rgba(255,255,255,.1)}
.crow .fl{height:100%;border-radius:7px;width:0;transition:width .9s cubic-bezier(.2,.85,.3,1)}
.crow .n{text-align:right;font-size:16px;font-weight:600}

/* Международные победы — золото. Единственное место в дашборде, где оно
   уместно: это медаль, а не оформление. Приглушённое, не жёлтое. */
.wrow.int{background:rgba(224,178,82,.1)}
.wrow.int:hover{background:rgba(224,178,82,.17)}
.wrow.int .wp{background:var(--gold);color:#171208}
.wrow.int .m{color:#BCA378}
.cup{width:16px;height:16px;flex-shrink:0;color:var(--gold);
  stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  vertical-align:-3px;margin-right:7px}

.winfilter{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 16px}
.wf{background:var(--s1);border:0;cursor:pointer;font:inherit;font-size:14px;color:var(--ink3);
  padding:8px 15px;border-radius:999px;transition:.18s;display:flex;align-items:center;gap:9px}
.wf:hover{background:var(--s2);color:var(--ink2)}
.wf.on{background:var(--s3);color:var(--ink)}
.wf .c{color:var(--ink4);font-size:13px}
.wf.on .c{color:var(--brand)}
/* одна колонка со своим скроллом — иначе 64 записи съедают полдашборда */
/* max-height обязателен: без него grid считает высоту строки по всем 64 записям
   и растягивает обе колонки на несколько тысяч пикселей */
.winlist{display:flex;flex-direction:column;gap:8px;
  flex:1;min-height:0;max-height:500px;overflow-y:auto;padding-right:8px}
.winlist::-webkit-scrollbar{width:9px}
.winlist{scrollbar-width:thin;scrollbar-color:#416f2c var(--s1)}
.winlist::-webkit-scrollbar-track{background:var(--s1);border-radius:999px}
.winlist::-webkit-scrollbar-thumb{background:#416f2c;border:2px solid var(--s1);border-radius:999px}
.winlist::-webkit-scrollbar-thumb:hover{background:var(--brand-dim)}
.winempty{grid-column:1/-1;color:var(--ink4);font-size:15px;padding:26px 0;text-align:center}
.wfbar{display:flex;align-items:center;gap:12px;margin:0 0 13px;flex-wrap:wrap}
.wfhint{color:var(--ink3);font-size:15px;font-weight:500}
.wfcount{color:var(--ink3);font-size:14px;margin-left:auto;white-space:nowrap}
.wfreset{background:none;border:0;cursor:pointer;font:inherit;font-size:14px;color:var(--brand);
  padding:8px 13px;border-radius:999px;transition:.16s}
.wfreset:hover{background:rgba(102,212,22,.12)}
.wrow{background:var(--s2);border-radius:10px;padding:10px 13px;display:flex;gap:11px;align-items:flex-start;
  flex-shrink:0;transition:.15s}
.wrow:hover{background:var(--s3)}
.wp{flex-shrink:0;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.06);color:var(--ink3);white-space:nowrap;margin-top:1px}
.wp.g{background:rgba(102,212,22,.16);color:var(--brand)}
.wp.s{color:var(--ink)}
.wrow .n{font-size:14px;line-height:1.35;font-weight:500}
.wrow .m{color:var(--ink3);font-size:12.5px;margin-top:3px;line-height:1.35}
.wrow .m .t{color:var(--warm)}

/* Рост идёт вверх: столбцы растут от основания, школы выстроены
   по возрастанию — весь график поднимается слева направо.
   Тусклое основание — прежний показатель, яркая часть сверху — прирост. */
.dumb{background:var(--s1);border-radius:var(--r);padding:26px 28px 20px}
/* сетевой итог крупно: отдельные 6, 7, 8 не впечатляют, а 28 → 68 читается сразу */
.ghero{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.06)}
.ghero .a{font-size:clamp(28px,2.6vw,40px);font-weight:700;color:var(--ink4);letter-spacing:-.02em}
.ghero .ar{font-size:clamp(22px,2vw,30px);color:var(--ink4)}
.ghero .b{font-size:clamp(54px,5.4vw,88px);font-weight:700;
  letter-spacing:-.042em;line-height:.9}
.ghero .x{font-size:clamp(20px,1.9vw,28px);font-weight:700;color:var(--bg);
  background:var(--brand);padding:5px 14px;border-radius:999px;letter-spacing:-.01em}
.ghero .cap{color:var(--ink3);font-size:14px;margin-left:auto;text-align:right;line-height:1.5}
.ghero .cap b{display:block;color:var(--ink2);font-weight:600}
.gperiod{color:var(--ink4);font-size:12.5px;margin-left:auto;text-align:right;line-height:1.5}
.gperiod b{display:block;color:var(--ink3);font-weight:600}
/* box-sizing:content-box и padding-top обязательны: подпись со значением
   вынесена над столбцом и живёт в этом отступе. Иначе высокие столбцы
   упираются в потолок и врут — 77% вместо 95%. */
.gplot{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(12px,1.5vw,26px);
  align-items:end;height:clamp(190px,23vh,260px);box-sizing:content-box;padding-top:62px;
  position:relative}
.gcol{position:relative;height:100%;min-width:0}
.gval{position:absolute;left:0;right:0;text-align:center}
.gval b{display:block;font-size:clamp(26px,2.4vw,38px);font-weight:700;line-height:1;letter-spacing:-.03em}
.gval i{display:block;font-size:14px;font-weight:600;font-style:normal;margin-top:6px;color:var(--ink3)}
/* столбцы узкие: широкие читались как приземистые кубики, а не как рост */
.gbar{position:absolute;left:21%;right:21%;bottom:0;display:flex;flex-direction:column;gap:2px}
.ggrow{border-radius:9px 9px 0 0;min-height:4px}
.gbase{border-radius:0 0 3px 3px;opacity:.36;min-height:3px}
.gfoot{text-align:center;margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.gfoot b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.gfoot span{display:block;color:var(--ink3);font-size:12px;margin-top:4px;line-height:1.3}
.gfoot em{display:block;color:var(--ink4);font-size:12px;font-style:normal;margin-top:6px}
.dlegend{display:flex;gap:22px;color:var(--ink4);font-size:12.5px;margin-top:18px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.05)}
.dlegend span{display:flex;align-items:center;gap:7px}
.dlegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.sm{background:var(--s1);border-radius:var(--r);padding:24px 26px}
.sm .s{font-size:19px;font-weight:700}
.sm .m{color:var(--ink3);font-size:14px;margin-top:4px;line-height:1.35;min-height:38px}
.sm svg{width:100%;height:66px;margin-top:8px;display:block}
.sm .foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px}
.sm .x{font-size:32px;font-weight:700;letter-spacing:-.02em}
.sm .ft{color:var(--ink3);font-size:17px}

/* ── 4. педагоги ───────────────────────────────────── */
.staff{display:grid;grid-template-columns:1.62fr 1fr;gap:22px}
.rung{display:grid;grid-template-columns:172px 1fr 70px;align-items:center;gap:20px;margin-bottom:16px}
.rung:last-child{margin-bottom:0}
.rung .nm{color:var(--ink2);font-size:17px;text-align:right}
.rung .track{height:46px;background:var(--s2);border-radius:11px;overflow:hidden}
.rung .fill{height:100%;border-radius:11px;width:0;transition:width 1s cubic-bezier(.2,.85,.3,1)}
.rung .n{font-size:26px;font-weight:700;text-align:right}
/* особый состав — сильные факты о людях, а не проценты */
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.mk{background:var(--s1);border-radius:var(--r);padding:22px 24px;display:flex;gap:15px;align-items:flex-start;
  background-image:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 42%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.mk .tick{flex-shrink:0;width:26px;height:26px;border-radius:9px;background:rgba(102,212,22,.15);
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.mk .tick svg{width:14px;height:14px;stroke:var(--brand);stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.mk .n{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:7px}
.mk .d{font-size:15px;line-height:1.4;color:var(--ink2);font-weight:500}
.sidestat{display:flex;flex-direction:column;gap:18px}
.ss{background:var(--s1);border-radius:var(--r);padding:26px 28px;flex:1;display:flex;flex-direction:column;justify-content:center}
.ss .v{font-size:54px;font-weight:700;line-height:1;letter-spacing:-.025em}
.ss .l{color:var(--ink3);font-size:15px;margin-top:9px;line-height:1.4}

/* ── особенности и ценности ────────────────────────── */
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
/* .fcard, а не .ft — .ft уже занят подписью «было → стало» в мини-графиках */
.fcard{background:var(--s1);border-radius:var(--r);padding:26px 28px;display:flex;gap:20px}
.fcard .i{flex-shrink:0;width:44px;height:44px;border-radius:13px;background:rgba(102,212,22,.13);
  color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.fcard .h{font-size:20px;font-weight:700;line-height:1.3}
.fcard .d{color:var(--ink3);font-size:15px;margin-top:9px;line-height:1.5}
.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.vl{background:var(--s1);border-radius:var(--r);padding:24px 26px}
.vl .ic{width:46px;height:46px;border-radius:14px;background:rgba(102,212,22,.12);
  display:flex;align-items:center;justify-content:center;margin-bottom:17px}
.vl .ic svg{width:24px;height:24px;stroke:var(--brand);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.vl .k{color:var(--brand);font-size:18px;font-weight:700}
.vl .d{color:var(--ink2);font-size:14.5px;margin-top:11px;line-height:1.5}

/* ── 5. стратегия ──────────────────────────────────── */
/* ═══ Орбита целей: ученик в центре, восемь целей по кольцу ═══ */
/* Орбита во всю ширину. Кольца эллиптические — круг на широком поле
   оставлял бы пустые бока. Вращать эллипс нельзя (он бы «качался»),
   поэтому по нему бежит пунктир. */
.orbwrap{position:relative;background:var(--s1);border-radius:var(--r);padding:18px;overflow:hidden;
  background-image:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 42%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.orbwrap::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 46% 62% at 50% 50%,rgba(102,212,22,.15),transparent 68%)}
.orbstage{position:relative}
#orb{width:100%;height:auto;display:block;position:relative}
@keyframes orbflow{to{stroke-dashoffset:-260}}
.orb-r{animation:orbflow 14s linear infinite}
.orb-r2{animation:orbflow 22s linear infinite reverse}

/* по орбитам летят частицы — без них кольца выглядят статичной разметкой */
@keyframes orbmove{to{offset-distance:100%}}
.odot{offset-rotate:0deg;animation:orbmove 26s linear infinite;
  filter:drop-shadow(0 0 7px rgba(134,235,61,.95))}
.odot.p1{offset-path:path("M128 358a672 272 0 1 0 1344 0a672 272 0 1 0 -1344 0")}
.odot.p2{offset-path:path("M308 358a492 199 0 1 0 984 0a492 199 0 1 0 -984 0");animation-duration:19s}
.odot.p3{offset-path:path("M488 358a312 126 0 1 0 624 0a312 126 0 1 0 -624 0");animation-duration:33s}

/* центр горит как звезда */
@keyframes starpulse{
 0%,100%{filter:drop-shadow(0 0 13px rgba(134,235,61,.8)) drop-shadow(0 0 34px rgba(102,212,22,.45))}
 50%    {filter:drop-shadow(0 0 24px rgba(180,255,120,1)) drop-shadow(0 0 60px rgba(102,212,22,.75))}
}
.ocore .ct{animation:starpulse 3.6s ease-in-out infinite}
@keyframes corepulse{
 0%,100%{opacity:.5;transform:scale(1)}
 50%    {opacity:.9;transform:scale(1.06)}
}
.ocore .halo{transform-origin:800px 358px;animation:corepulse 3.6s ease-in-out infinite}

/* всплывающая подсказка у выбранного узла */
.otip{position:absolute;z-index:8;width:min(400px,34vw);
  background:rgba(20,25,17,.82);backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--r2);padding:18px 20px;
  box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  animation:tipin .26s cubic-bezier(.2,.9,.3,1)}
@keyframes tipin{from{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.95)}}
.otip .qual{display:inline-block;margin-bottom:10px;background:rgba(102,212,22,.15);color:var(--brand);
  font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px}
.otip .nums{display:flex;align-items:baseline;gap:11px;margin-bottom:10px}
.otip .nums .a{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:.9}
.otip .nums .b{font-size:17px;color:var(--ink3);font-weight:600}
.otip .ttl{font-size:15.5px;line-height:1.45;font-weight:500;color:var(--ink2)}
.otip .tr{height:9px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-top:14px}
.otip .fl{height:100%;background:var(--brand);border-radius:5px;width:0;
  transition:width .8s cubic-bezier(.2,.85,.3,1)}
.otip .gp{margin-top:9px;color:var(--ink4);font-size:13px}
.otip .gp b{color:var(--brand);font-weight:700;font-size:15px}
.otip .cls{position:absolute;top:10px;right:12px;background:none;border:0;cursor:pointer;
  color:var(--ink4);font-size:17px;line-height:1;padding:4px}
.otip .cls:hover{color:var(--ink)}
.onode{cursor:pointer}
.onode .disc{fill:var(--s2);stroke:rgba(255,255,255,.13);stroke-width:1.4;transition:.2s}
.onode:hover .disc{fill:var(--s3);stroke:var(--brand)}
.onode.on .disc{fill:rgba(102,212,22,.17);stroke:var(--brand);stroke-width:2}
.onode .oic{stroke:var(--ink3);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.onode:hover .oic,.onode.on .oic{stroke:var(--brand)}
.onode .olb{fill:var(--ink3);font-size:13px;font-weight:600;text-anchor:middle;transition:.2s;
  font-family:'Segoe UI',system-ui,sans-serif}
.onode:hover .olb,.onode.on .olb{fill:#fff}
.ocore .ct{fill:#fff;font-weight:700;text-anchor:middle;font-family:'Segoe UI',system-ui,sans-serif}
.ocore .cs{fill:var(--ink3);font-size:13.5px;text-anchor:middle;font-family:'Segoe UI',system-ui,sans-serif}

.opanel{background:var(--s1);border-radius:var(--r);padding:30px 32px;min-height:300px;
  display:flex;flex-direction:column;justify-content:center;
  background-image:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 42%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.opanel .hint{color:var(--ink4);font-size:15px;line-height:1.6}
.opanel .ttl{font-size:clamp(20px,1.7vw,26px);font-weight:600;line-height:1.3;letter-spacing:-.015em}
.opanel .nums{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.opanel .nums .a{font-size:clamp(38px,3.4vw,54px);font-weight:700;letter-spacing:-.04em;line-height:.9}
.opanel .nums .b{font-size:22px;color:var(--ink3);font-weight:600}
.opanel .tr{height:11px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:22px}
.opanel .fl{height:100%;background:var(--brand);border-radius:6px;width:0;
  transition:width .9s cubic-bezier(.2,.85,.3,1)}
.opanel .gp{margin-top:12px;color:var(--ink4);font-size:14px}
.opanel .gp b{color:var(--brand);font-weight:700;font-size:16.5px}
.opanel .qual{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;
  background:rgba(102,212,22,.13);color:var(--brand);font-size:12.5px;font-weight:700;
  padding:5px 12px;border-radius:999px}

.goals4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.goal .gap{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);
  color:var(--ink4);font-size:13.5px}
.goal .gap b{color:var(--brand);font-weight:700;font-size:16px}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.hz .sum{color:var(--ink);font-size:16px;line-height:1.6;font-weight:500;margin-bottom:12px}
.hz .tag-a{display:inline-block;background:rgba(255,255,255,.06);color:var(--ink3);
  font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;margin-bottom:12px}
.syn{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* заполненный горизонт выделен — два соседних ждут обсуждения */
.hz.on{background-image:linear-gradient(180deg,rgba(102,212,22,.07),rgba(255,255,255,0) 46%)}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.goal{background:var(--s1);border-radius:var(--r);padding:26px 28px}
.goal .top{display:flex;align-items:baseline;gap:14px}
.goal .now{font-size:56px;font-weight:700;letter-spacing:-.03em;color:var(--brand)}
.goal .tgt{color:var(--ink3);font-size:26px;font-weight:600}
.goal .l{color:var(--ink3);font-size:15.5px;margin-top:6px}
.goal .tr{height:11px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:20px}
.goal .fl{height:100%;background:var(--brand);border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.85,.3,1)}
.horizon{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.hz{background:var(--s1);border-radius:var(--r);padding:26px 28px}
.hz .y{font-size:20px;color:var(--brand);font-weight:700;margin-bottom:16px}
.hz ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.hz li{font-size:15.5px;line-height:1.45;color:var(--ink2);padding-left:17px;position:relative}
.hz li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--brand-dim)}
.hz .soon{color:var(--ink4);font-size:15.5px;line-height:1.5}

footer{margin-top:76px;padding:26px 0 0;border-top:1px solid rgba(255,255,255,.05);
  color:var(--ink4);font-size:14px;line-height:1.65}
footer b{color:var(--ink3);font-weight:600}

/* системная настройка «уменьшить движение»: разделы показываются сразу,
   переходы гасятся — иначе анимация мешает тем, кому она противопоказана */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  section{opacity:1;transform:none}
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* нижняя кромка: гасит наполовину срезанный заголовок следующего раздела */
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:84px;z-index:40;
  pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 86%)}

/* На невысоких экранах высоту первого раздела задаёт не карта, а четыре
   карточки справа: им нужно 450px, а свободно 409. Поджимаем их.
   Блок стоит последним намеренно — иначе правила .kpi выше перебьют его. */
@media (max-height:820px){
  .kpi{padding:10px 22px;gap:4px}
  .kpi .l{font-size:13.5px}
  .kpi .x{font-size:12.5px;padding-top:5px}
  .tl{padding:14px 22px}
  .tl .y{font-size:24px}
  .tl .c{font-size:14.5px;margin-top:4px}
}
@media (max-width:1050px){
  .annual-centerbar{grid-template-columns:repeat(4,minmax(0,1fr))}
  .annual-centerbar button:nth-child(4n){border-right:0}
  .annual-panel{grid-template-columns:1fr;min-height:0}
  .annual-summary{border-left:0;border-top:1px solid rgba(255,255,255,.07);padding:20px 0 0;
    display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:24px}
  .annual-summary .caption{margin-top:0}.annual-summary .latest{grid-row:1/3;grid-column:2;margin:0}
  .annual-summary .delta,.annual-summary .range{grid-column:1}.annual-note{grid-column:1/-1}
}
@media (max-width:700px){
  .annual-controls,.annual-picker.metric{width:100%}
  .annual-centerbar{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .annual-centerbar::-webkit-scrollbar{display:none}
  .annual-centerbar button{flex:0 0 178px;scroll-snap-align:start}
  .annual-panel{padding:20px 16px;gap:18px}
  .annual-summary .latest{font-size:52px}
}
</style>

function mapSvg(){
 const vis=c=>yr===null||c.year<=yr;
 const nSchools=id=>SCHOOLS.filter(s=>CITY_OF[s.id]===id).length;
 return `<svg id="map" viewBox="-14 -14 1028 571">
  <path id="kz" d="${KZPATH}"/>
  ${CITIES.map((c,ci)=>{
    const on=vis(c), act=selCity===c.id, dim=selCity&&!act;
    const r=(nSchools(c.id)>1?9.6:7.2)*(act?1.3:1);
    // подпись выносится за пределы свечения, иначе текст тонет в нём
    const off=r*(act?3.9:2.9)+7;
    return `
   <g class="cityg ${on?'cityhit':''} ${act?'act':''}" opacity="${!on?.2:dim?.18:1}"
      ${on?`onclick="setCity('${c.id}')"`:''}>
    ${on&&!dim?`<circle class="city-ripple" cx="${c.x}" cy="${c.y}" r="${r*1.18}"
            style="animation-delay:${(-ci*.43).toFixed(2)}s"/>
          <circle class="city-ripple r2" cx="${c.x}" cy="${c.y}" r="${r*1.18}"
            style="animation-delay:${(1.8-ci*.43).toFixed(2)}s"/>
          <circle cx="${c.x}" cy="${c.y}" r="${r*(act?4.2:3.2)}" fill="var(--brand)" opacity="${act?.13:.07}"/>
          <circle cx="${c.x}" cy="${c.y}" r="${r*(act?2.4:1.8)}" fill="var(--brand)" opacity="${act?.2:.13}"/>`:''}
    ${act?`<circle cx="${c.x}" cy="${c.y}" r="${r*2}" fill="none" stroke="var(--brand-hi)" stroke-width="2.2" opacity=".95"/>`:''}
    <circle class="cdot" cx="${c.x}" cy="${c.y}" r="${r}" fill="${on?'var(--brand-hi)':'var(--ink4)'}"
      style="animation-delay:${(-ci*.31).toFixed(2)}s"/>
    <text class="clabel" x="${c.x+(c.a==='end'?-off:off)}" y="${c.y+7}" text-anchor="${c.a}"
      style="font-size:${act?24:20}px" fill="${on?'#fff':'var(--ink4)'}">${c[lang]}</text>
    ${on?`<circle cx="${c.x}" cy="${c.y}" r="30" fill="transparent"/>`:''}
   </g>`}).join('')}
 </svg>`;
}

/* русский счётный род: 1 школа / 2–4 школы / 5+ школ */
function plural(n,f){
 if(lang==='kz')return f[0];
 const a=n%10,b=n%100;
 if(a===1&&b!==11)return f[0];
 if(a>=2&&a<=4&&(b<10||b>=20))return f[1];
 return f[2];
}

/* Блок побед: 62 записи из 555.docx — счётчики, разрез по уровням,
   международные победители отдельно и полный список с фильтром по школам */
const CUP=`<svg class="cup" viewBox="0 0 24 24"><path d="M8 21h8M12 17.5V21M6.5 4h11v5.5a5.5 5.5 0 0 1-11 0V4Z"/><path d="M6.5 6H4.5a2.2 2.2 0 0 0 0 4.4h2M17.5 6h2a2.2 2.2 0 0 1 0 4.4h-2"/></svg>`;

function annualBlock(){
 const schoolIds=[...new Set(ANNUAL.map(r=>r.s))].filter(id=>SCHOOLS.some(s=>s.id===id));
 if(schoolIds.length&&annualSchool!=='all'&&!schoolIds.includes(annualSchool))annualSchool=schoolIds[0];
 const allMode=annualSchool==='all';
 const metrics=[];
 ANNUAL.forEach(r=>{if(!metrics.some(m=>m.kz===r.kz))metrics.push({kz:r.kz,ru:r.ru})});
 if(metrics.length&&(annualMetric<0||annualMetric>=metrics.length)){
  const preferred=metrics.findIndex(m=>m.kz===ANNUAL_DEFAULT_METRIC);
  annualMetric=preferred>=0?preferred:0;
 }
 const metric=metrics[annualMetric], selectedSchool=allMode?null:SCHOOLS.find(s=>s.id===annualSchool);
 if(!metric||(!allMode&&!selectedSchool))return `<div class="annual-frame" id="annual-results">
   <div class="blockhead"><div><h3>${t('annualT')}</h3><div class="sub">${t('annualS')}</div></div></div>
   <div class="annual-panel"><div class="annual-empty">${t('annualNoData')}</div></div></div>`;
 const series=schoolIds.map(id=>{
   const school=SCHOOLS.find(s=>s.id===id);
   const row=ANNUAL.find(r=>r.s===id&&r.kz===metric.kz);
   return {school,row};
 });
 const plotted=series.filter(x=>x.row&&x.row.values.some(v=>v!=null));
 const selected=allMode?null:series.find(x=>x.school.id===annualSchool);
 const selectedRow=selected&&selected.row;
 const selectedColor=selectedSchool?cv(selectedSchool.c):cv(0);
 const controls=`<div class="annual-controls">
   <label class="annual-picker metric"><span>${t('annualOlympiad')}</span>
     <div class="annual-selectbox"><i></i><select onchange="setAnnualMetric(this.value)">
       ${metrics.map((m,i)=>{const available=ANNUAL.some(r=>(allMode||r.s===annualSchool)&&r.kz===m.kz&&r.values.some(v=>v!=null));
         return `<option value="${i}" ${i===annualMetric?'selected':''} ${available?'':'disabled'}>${html(m[lang])}</option>`}).join('')}
     </select></div></label></div>`;

 const valid=plotted.flatMap(x=>x.row.values).filter(v=>v!=null), max=Math.max(...valid,1);
 const rawMax=Math.max(max*1.08,1),magnitude=10**Math.floor(Math.log10(rawMax));
 const scaled=rawMax/magnitude,step=[1,2,2.5,4,5,10].find(n=>n>=scaled)||10;
 const yMax=step*magnitude;
 const W=1000,H=310,L=72,R=42,Tp=32,B=54,plotH=H-Tp-B;
 const xs=[L,(L+W-R)/2,W-R], y=v=>Tp+plotH*(1-v/yMax);
 const pathFor=values=>{let d='';values.forEach((v,i)=>{if(v!=null)d+=`${i&&values[i-1]!=null?'L':'M'} ${xs[i]} ${y(v)} `});return d};
 const areaFor=values=>{
   const areas=[];let segment=[];
   values.forEach((v,i)=>{if(v!=null)segment.push([xs[i],y(v)]);if((v==null||i===values.length-1)&&segment.length){
    if(segment.length>1)areas.push(`M ${segment[0][0]} ${Tp+plotH} L ${segment.map(p=>p.join(' ')).join(' L ')} L ${segment.at(-1)[0]} ${Tp+plotH} Z`);
    segment=[];
   }});return areas;
 };
 const values=selectedRow?selectedRow.values:[null,null,null];
 const firstIndex=values.findIndex(v=>v!=null), lastIndex=values.map(v=>v!=null).lastIndexOf(true);
 const first=firstIndex>=0?values[firstIndex]:null, latest=lastIndex>=0?values[lastIndex]:null;
 const delta=first!=null&&latest!=null?latest-first:null;
 const deltaText=delta==null?'—':`${delta>0?'+':''}${delta}`;
 const drawSeries=[...plotted].sort((a,b)=>Number(a.school.id===annualSchool)-Number(b.school.id===annualSchool));
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${html(metric[lang])}">
   <defs><linearGradient id="annualFill-${annualSchool}" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="${selectedColor}" stop-opacity=".72"/><stop offset="1" stop-color="${selectedColor}" stop-opacity="0"/>
   </linearGradient></defs>
   ${[0,.25,.5,.75,1].map(f=>`<line class="annual-grid" x1="${L}" x2="${W-R}" y1="${Tp+plotH*f}" y2="${Tp+plotH*f}"/>
     <text class="annual-axis" x="${L-15}" y="${Tp+plotH*f+5}" text-anchor="end">${Math.round(yMax*(1-f))}</text>`).join('')}
   ${drawSeries.map((item,si)=>{
     const on=!allMode&&item.school.id===annualSchool,color=cv(item.school.c),vals=item.row.values;
     return `<g class="annual-series ${on?'on':allMode?'overview':'dim'}" style="--series-color:${color}" onclick="setAnnualSchool('${item.school.id}')">
       ${on?areaFor(vals).map(d=>`<path class="annual-area" d="${d}" fill="url(#annualFill-${annualSchool})"/>`).join(''):''}
       <path class="annual-hit" d="${pathFor(vals)}"/>
       <path class="annual-line" d="${pathFor(vals)}" stroke="${color}" pathLength="1" style="animation-delay:${si*.07}s"/>
       ${vals.map((v,i)=>v==null?'':`<circle class="annual-point-halo" cx="${xs[i]}" cy="${y(v)}" r="${on?17:11}" fill="${color}"/>
         <circle class="annual-point" cx="${xs[i]}" cy="${y(v)}" r="${on?8:5.5}" fill="${color}" style="animation-delay:${.18+si*.05+i*.08}s"/>
         ${on?`<text class="annual-value" x="${xs[i]}" y="${Math.max(21,y(v)-18)}" text-anchor="middle">${v.toLocaleString('ru-RU')}</text>`:''}`).join('')}
     </g>`}).join('')}
   ${ANNUAL_YEARS.map((year,i)=>`<text class="annual-axis" x="${xs[i]}" y="${H-13}" text-anchor="middle">${year}</text>`).join('')}
 </svg>`;
 const centerbar=`<div class="annual-centerbar" style="--center-count:${plotted.length}" aria-label="${t('annualCenter')}">${plotted.map(item=>{
   const last=[...item.row.values].reverse().find(v=>v!=null),on=item.school.id===annualSchool,color=cv(item.school.c);
   return `<button class="${on?'on':''}" style="--series-color:${color}" onclick="setAnnualSchool('${item.school.id}')" title="${html(item.school.name)}">
     <i></i><span>${html(item.school.name)}</span><b class="num">${last==null?'—':last}</b></button>`;
 }).join('')}</div>`;
 const periodSummary=firstIndex>=0&&lastIndex>firstIndex
  ?`<div class="delta num">${deltaText}</div>
    <div class="range">${t('annualChange')} · ${ANNUAL_YEARS[firstIndex]} → ${ANNUAL_YEARS[lastIndex]}</div>`
  :`<div class="range">${t('annualOneYear')}</div>`;
 const summary=selectedRow
  ?`<div class="caption">${t('annualLatest')} · ${ANNUAL_YEARS[lastIndex]}</div>
    <div class="latest num">${latest.toLocaleString('ru-RU')}</div>
    ${periodSummary}
    ${selectedRow.note?`<div class="annual-note">${html(selectedRow.note)}</div>`:''}`
  :`<div class="caption">${t('annualNoData')}</div><div class="latest num">—</div>`;
 const ranked=[...plotted].map(item=>({item,last:[...item.row.values].reverse().find(v=>v!=null)}))
  .sort((a,b)=>(b.last??-Infinity)-(a.last??-Infinity));
 const allSummary=`<div class="school">${t('annualAllCenters')}<br>${html(metric[lang])}</div>
   <div class="caption">${t('annualLatest')} · ${ANNUAL_YEARS.at(-1)}</div>
   <div class="annual-rank">${ranked.map(({item,last})=>{const color=cv(item.school.c);return `<button
     style="--series-color:${color}" onclick="setAnnualSchool('${item.school.id}')"><i></i><span>${html(item.school.name)}</span>
     <b class="num">${last==null?'—':last}</b></button>`}).join('')}</div>`;
 const sideContent=allMode?allSummary:`<div class="school">${html(selectedSchool.name)}<br>${html(metric[lang])}</div>${summary}`;
 return `<div class="annual-frame" id="annual-results">
   <div class="blockhead"><div><h3>${t('annualT')}</h3><div class="sub">${t('annualS')}</div></div>${controls}</div>
   ${centerbar}<div class="annual-panel"><div class="annual-chart">${svg}</div>
     <aside class="annual-summary" style="--series-color:${selectedColor}">${sideContent}</aside></div></div>`;
}

function winsBlock(){
 /* места и уровни — обе шкалы порядковые, поэтому не пёстрые цвета,
    а два одноцветных градиента: зелёный для мест, синий для уровней */
 /* грамоты, благодарности и записи без места схлопнуты в одну строку —
    по отдельности они только удлиняли график, ничего не добавляя */
 const OTHER=['gr','let','none'];
 const PL=[[1,'#86EB3D'],[2,'#66D416'],[3,'#4C9D10'],['gp','#3B780C'],['other','#5A6355']];
 /* вторая ось — школы, а не уровни: уровень не записан у 24 побед из 64,
    и на графике «не указан» становился самым длинным столбцом */
 const SC=SCHOOLS.filter(s=>WINS.some(w=>w.s===s.id))
   .map(s=>({s,n:WINS.filter(w=>w.s===s.id).length})).sort((a,b)=>b.n-a.n);
 const isP=(w,p)=>p==='other'?OTHER.includes(w.p):w.p===p;
 const cntP=p=>WINS.filter(w=>isP(w,p)).length;
 const maxP=Math.max(...PL.map(([p])=>cntP(p)));
 const maxS=Math.max(...SC.map(x=>x.n));
 const gold=cntP(1);   /* только первые места, без гран-при */
 const lOrd=l=>({int:0,rep:1,obl:2,city:3,'':4})[l];
 /* первые места впереди: гран-при здесь дают на мелких состязаниях
    и весит он меньше, чем первое место на олимпиаде */
 const pOrd=p=>({1:0,2:1,3:2,gp:3,gr:4,let:5,none:6}[p]??7);
 const rank=w=>lOrd(w.l)*10+pOrd(w.p);
 const nm=id=>SCHOOLS.find(x=>x.id===id);
 /* порядок по местам: гран-при и первые сверху, внутри места — по уровню */
 const list=WINS.filter(w=>(!winSchool||w.s===winSchool)&&(winPlace===null||isP(w,winPlace)))
   .sort((a,b)=>pOrd(a.p)-pOrd(b.p)||lOrd(a.l)-lOrd(b.l));
 const plc=p=>p==null?'—':T.pl[p][lang];
 const bar=(on,click,label,n,max,col,dot)=>`<div class="crow ${on?'on':''}" onclick="${click}">
   <div class="t">${dot?`<span class="sdot" style="background:${col}"></span>`:''}${label}</div>
   <div class="tr"><div class="fl" data-w="${max?n/max*100:0}" style="background:${col}"></div></div>
   <div class="n num">${n}</div></div>`;
 const active=winSchool||winPlace!==null;
 return `
 <div class="blockhead" id="wins-heading">
   <div><h3>${t('win')}</h3><div class="sub">${t('winS')}</div></div>
   <div class="headstats">
     <div class="hs"><div class="v num big-n">${WINS.length}</div><div class="l">${t('wTotal')}</div></div>
     <div class="hs"><div class="v num">${gold}</div><div class="l">${t('wGold')}</div></div>
     <div class="hs"><div class="v num">${WINS.filter(w=>w.l==='int').length}</div><div class="l">${t('wInt')}</div></div>
   </div>
 </div>
 <div class="winmain" id="wins-body">
   <div class="wincharts">
     <div class="chartcard"><h4>${t('byPlace')}</h4>
       ${PL.map(([p,c])=>bar(winPlace===p,`setWinPlace(${typeof p==='string'?`'${p}'`:p})`,
          T.pl[p][lang],cntP(p),maxP,c)).join('')}</div>
     <div class="chartcard"><h4>${t('bySchool')}</h4>
       ${SC.map(x=>bar(winSchool===x.s.id,`setWinSchool('${x.s.id}')`,
          x.s.name,x.n,maxS,cv(x.s.c),1)).join('')}</div>
   </div>
   <div class="chartcard winlistcard">
 <div class="wfbar">
   <span class="wfhint">${t('allWins')}</span>
   ${active?`<button class="wfreset" onclick="resetWins()">${t('reset')}</button>`:''}
   <span class="wfcount num">${list.length} / ${WINS.length} ${t('shown')}</span>
 </div>
 <div class="winlist">
   ${list.length===0?`<div class="winempty">${t('nothing')}</div>`:''}
   ${list.map(w=>{
     const g=(w.p===1||w.p==='gp')?'g':(w.p===2?'s':'');
     const meta=[w.w,nm(w.s).name,w.l?T.lvl[w.l][lang]:null,
       w.c?`${t('coach')}: ${w.c}`:null,
       w.q>1?`${w.q} ${t('nWin')}`:null].filter(Boolean).join(' · ');
     /* атрибуты дублируют данные строки — по ним можно сортировать
        и фильтровать снаружи, не разбирая текст */
     return `<div class="wrow ${w.l==='int'?'int':''}"
       data-place="${w.p}" data-level="${w.l||'none'}" data-school="${w.s}"
       data-who="${w.t?'teacher':'student'}" data-rank="${rank(w)}"
       data-name="${w.n.replace(/"/g,'&quot;')}">
       <span class="wp ${g}">${plc(w.p)}</span>
       <div><div class="n">${w.l==='int'?CUP:''}${w.n}</div>
       <div class="m">${w.t?`<span class="t">${t('teacherWin')}</span> · `:''}${meta}</div></div>
     </div>`}).join('')}
 </div></div></div>`;
}

function secResults(){
 const R=54,C=2*Math.PI*R;
 const grantShare=(AGG.grantShare??0).toFixed(1).replace('.',',');
 return `<section id="s3"><div class="sechead">
   <div><h2>${t('s3')}</h2><div class="sub">${t('s3s')}</div></div>
   <div class="headstats"><div class="hs"><div class="v num big-n">${grantShare}%</div><div class="l">${t('shr')}</div></div></div></div>
 <div class="gr">
  ${GRANTS.map(g=>`<div class="donut"><svg viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--s2)" stroke-width="14"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="${cv(g.c)}" stroke-width="14" stroke-linecap="round"

function orbTip(){

 const o=ORBIT[orbSel], p=orbPos(orbSel), {w,h,cy,nr}=OVB;

/* Оживление привязано к разделу, а не к загрузке: полосы, кольца и счётчики
   отрабатывают в тот момент, когда раздел въезжает в экран. Раньше всё
   отыгрывало разом внизу страницы, где этого никто не видел. */
function fillNow(s){
 if(s.dataset.filled)return;
 s.dataset.filled='1';
 s.querySelectorAll('[data-w]').forEach(e=>{e.style.transition='none';e.style.width=e.dataset.w+'%'});
 s.querySelectorAll('[data-dash]').forEach(e=>{e.style.transition='none';e.style.strokeDashoffset=e.dataset.dash});
 s.querySelectorAll('[data-c]').forEach(e=>e.textContent=(+e.dataset.c).toLocaleString('ru-RU'));
 requestAnimationFrame(()=>s.querySelectorAll('[data-w],[data-dash]').forEach(e=>e.style.transition=''));
}
function animateIn(s){
 if(s.dataset.filled)return;
 s.dataset.filled='1';
 s.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
 s.querySelectorAll('[data-dash]').forEach(e=>e.style.strokeDashoffset=e.dataset.dash);
 s.querySelectorAll('[data-c]').forEach(tween);
}
function tween(el){
 const v=+el.dataset.c, t0=performance.now(), dur=1100;
 const f=n=>{const p=Math.min((n-t0)/dur,1), e=1-Math.pow(1-p,3);
   el.textContent=Math.round(v*e).toLocaleString('ru-RU'); if(p<1)requestAnimationFrame(f)};
 requestAnimationFrame(f);
}

 const y=window.scrollY+120;

}

let presentationNavLocked=false;
const PRESENTATION_FRAMES=[
 {top:0},
 {from:'#s2 .sechead',to:'#s2 .tbl'},
 {from:'#s2 .profile',to:'#s2 .profile'},
 {from:'#s3 .sechead',to:'#s3 .gr'},
 {from:'#annual-results',to:'#annual-results'},
 {from:'#wins-heading',to:'#wins-body'},
 {from:'#growth-heading',to:'#growth-body'},
 {from:'#s4 .sechead',to:'#s4 .marks'},
 {from:'#s5 .sechead',to:'#s5 .feats'},
 {from:'#s5 .blockhead:nth-of-type(3)',to:'#s5 .vals'},
 {from:'#s5 .blockhead:nth-of-type(5)',to:'#s5 .syn'},
 {from:'#s6 .sechead',to:'#s6 .orbwrap'},
 {bottom:true,from:'#s6 .orbwrap',to:'#s6 footer'}
];
function presentationFramePoints(){
 const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
 const layoutTop=el=>{
  let top=0;
  for(let node=el;node;node=node.offsetParent)top+=node.offsetTop;
  return top;
 };
 const points=PRESENTATION_FRAMES.map(frame=>{
  if(frame.top===0)return {top:0,frame};
  if(frame.bottom)return {top:max,frame};
  const first=document.querySelector(frame.from);
  const last=document.querySelector(frame.to||frame.from);
  if(!first||!last)return null;
  const top=layoutTop(first);
  const bottom=layoutTop(last)+last.offsetHeight;
  return {top:Math.max(0,Math.min(max,(top+bottom-innerHeight)/2)),frame};
 }).filter(Boolean).sort((a,b)=>a.top-b.top);
 return points.filter((point,i)=>!i||Math.abs(point.top-points[i-1].top)>24);
}
function presentationStops(){
 return presentationFramePoints().map(point=>point.top);
}
function presentationFrameElements(frame){
 if(frame.top===0)return [...document.querySelectorAll('#s1> *')];
 const first=document.querySelector(frame.from);
 const last=document.querySelector(frame.to||frame.from);
 if(!first||!last)return [];
 const els=[];
 for(let el=first;el;el=el.nextElementSibling){
  els.push(el);
  if(el===last)break;
 }
 return els;
}
function focusPresentationFrame(frame){
 document.body.classList.add('presentation-mode');
 document.querySelectorAll('.presentation-focus').forEach(el=>el.classList.remove('presentation-focus'));
 presentationFrameElements(frame).forEach(el=>el.classList.add('presentation-focus'));
}
function exitPresentationFocus(){
 document.body.classList.remove('presentation-mode');
 document.querySelectorAll('.presentation-focus').forEach(el=>el.classList.remove('presentation-focus'));
}
function stepPresentation(direction){
 if(presentationNavLocked)return;
 const points=presentationFramePoints();
 const y=Math.max(0,window.scrollY);
 const candidates=direction>0?points:points.slice().reverse();
 const target=candidates.find(point=>direction>0?point.top>y+24:point.top<y-24);
 if(!target)return;
 if(Math.abs(target.top-y)<2)return;
 focusPresentationFrame(target.frame);
 presentationNavLocked=true;
 scrollTo({
  top:target.top,
  behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'
 });
 setTimeout(()=>{presentationNavLocked=false},650);
}
/* e.code works with both Kazakh and Russian keyboard layouts. */
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==='KeyF'){toggleFS();return}
 if(e.repeat)return;
 const el=document.activeElement;
 if(el&&(el.matches('input,textarea,select')||el.isContentEditable))return;
 if(e.code==='ArrowRight'||e.code==='ArrowDown'){
  e.preventDefault();
  stepPresentation(1);
 }else if(e.code==='ArrowLeft'||e.code==='ArrowUp'){
  e.preventDefault();
  stepPresentation(-1);
 }
});
